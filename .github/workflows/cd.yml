name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Production dbt Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt Snowflake
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Configure Production dbt Profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOL
          banking_dbt:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ACCOUNTADMIN
                database: BANKING
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: ANALYTICS
                threads: 8
          EOL

      - name: Run dbt Transformations & Data Tests (Production)
        run: |
          cd banking_dbt
          dbt deps
          dbt run
          dbt test
